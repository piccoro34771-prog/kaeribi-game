<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>帰り灯 KAERIBI — 夜の路地</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d17;font-family:"Hiragino Kaku Gothic ProN",sans-serif;color:#f4e9d8}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top,12px);left:14px;pointer-events:none;text-shadow:0 2px 8px #000;font-size:13px;letter-spacing:.16em}#top b{font-size:18px;font-weight:400}#note{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:#0b111bdc;border:1px solid #aaa08c66;border-radius:5px;padding:10px 18px;max-width:85vw;min-width:170px;text-align:center;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s}#stick{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#c2c4cb20;border:1px solid #cdd3db77;touch-action:none;user-select:none}#nub{position:absolute;left:39px;top:39px;width:52px;height:52px;border-radius:50%;background:#c9d3db80;border:2px solid #d5dce3a0;box-shadow:0 0 20px #0008;pointer-events:none}#act{position:fixed;right:24px;bottom:calc(47px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:1px solid #ded5c5a0;background:#333f50a8;color:#f3e9d9;font-size:14px;touch-action:none}#run{position:fixed;right:115px;bottom:calc(30px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:1px solid #ded5c577;background:#333f5088;color:#f3e9d9;font-size:12px;touch-action:none}@media(pointer:fine){#stick,#act,#run{opacity:.32}} </style></head><body><canvas id="view"></canvas><div id="top"><b>帰り灯</b>　<small>KAERIBI / 夜の路地</small></div><div id="note"></div><div id="stick"><div id="nub"></div></div><button id="run">走る</button><button id="act">調べる</button><script>
"use strict";
const cv=document.getElementById('view'),ctx=cv.getContext('2d');let vw=0,vh=0,scale=1;function resize(){vw=innerWidth;vh=innerHeight;cv.width=Math.round(vw*devicePixelRatio);cv.height=Math.round(vh*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const C=ctx,W=1300,H=1000;const girl={x:630,y:650,face:0,step:0};let camera={x:girl.x,y:girl.y},joy={x:0,y:0,id:null},keys=new Set(),run=false,t=0,noticeUntil=0;
function fill(x,y,w,h,c){C.fillStyle=c;C.fillRect(x,y,w,h)}function poly(points,color,stroke=null,lw=1){C.beginPath();C.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)C.lineTo(points[i][0],points[i][1]);C.closePath();C.fillStyle=color;C.fill();if(stroke){C.strokeStyle=stroke;C.lineWidth=lw;C.stroke()}}
function ellipse(x,y,rx,ry,color){C.beginPath();C.ellipse(x,y,rx,ry,0,0,Math.PI*2);C.fillStyle=color;C.fill()}
function stroke(x1,y1,x2,y2,c,w=1){C.strokeStyle=c;C.lineWidth=w;C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.stroke()}
function rng(n){return()=>((n=(n*1664525+1013904223)>>>0)/4294967296)}const rnd=rng(77321),flecks=Array.from({length:750},()=>({x:rnd()*W,y:rnd()*H,r:rnd()*1.5})); 
const houses=[
{x:50,y:40,w:345,h:270,type:0},{x:460,y:35,w:360,h:265,type:1},{x:900,y:45,w:320,h:250,type:2},
{x:55,y:760,w:340,h:215,type:2},{x:465,y:815,w:360,h:180,type:0},{x:910,y:765,w:320,h:220,type:1}];
function house(h){const{x,y,w,h:hh,type}=h;C.save();C.shadowColor='#02040b';C.shadowBlur=18;C.shadowOffsetY=13;fill(x,y+30,w,hh-20,type===0?'#535c65':type===1?'#555c59':'#68675f');C.restore();
fill(x+12,y+55,w-24,hh-66,type===0?'#74756d':type===1?'#6a716c':'#827d70');for(let i=0;i<Math.floor(w/18);i++)stroke(x+18+i*18,y+58,x+18+i*18,y+hh-15,'#50595333',1);
poly([[x-22,y+62],[x+35,y-12],[x+w-28,y-12],[x+w+22,y+62]],type===0?'#303c4b':type===1?'#42464b':'#424e52','#1c2834',3);
for(let k=0;k<Math.floor(w/22);k++){stroke(x+20+k*22,y+2,x+45+k*22,y+56,'#77818a38',2)}
stroke(x-22,y+62,x+w+22,y+62,'#9d9a86',4);
for(let i=0;i<3;i++){let xx=x+35+i*(w-90)/2;fill(xx,y+94,52,54,'#2e3945');fill(xx+5,y+99,42,44,(i+type)%4===0?'#c9a66c':'#3a4650');stroke(xx+26,y+94,xx+26,y+148,'#9ca6a0',3);stroke(xx,y+121,xx+52,y+121,'#9ca6a0',3);fill(xx+3,y+150,57,4,'#333e44')}
fill(x+w*.47,y+hh-82,60,72,'#333d45');fill(x+w*.47+6,y+hh-77,48,65,'#636d69');fill(x+w*.47+42,y+hh-45,3,3,'#d2c5a1');for(let i=0;i<6;i++)stroke(x+10,y+hh-11+i*2,x+w-10,y+hh-11+i*2,'#464c4d',1);
fill(x+w-70,y+hh-62,45,32,'#a3a6a0');fill(x+w-66,y+hh-58,37,24,'#606d72');for(let i=0;i<5;i++)stroke(x+w-61,y+hh-55+i*4,x+w-32,y+hh-55+i*4,'#a5aaa7',1);
}
function tree(x,y,r){ellipse(x+7,y+15,r*.55,r*.35,'#080f15a0');fill(x-3,y-22,6,42,'#3d4037');for(let i=0;i<8;i++){let a=i*2.4;ellipse(x+Math.sin(a)*r*.43,y-37+Math.cos(a)*r*.3,r*.53,r*.45,i%2?'#293f39':'#344a3f')}}
function street(){fill(0,0,W,H,'#434a4a');fill(390,0,72,H,'#5c5c57');fill(820,0,82,H,'#5b5c57');fill(0,300,W,465,'#535b5a');fill(0,338,W,18,'#6b6e67');fill(0,744,W,12,'#73716a');
for(const p of flecks){fill(p.x,p.y,p.r+1,p.r+1,p.x%3<1?'#8b8b7c2c':'#1b272d22')}
for(let y=0;y<H;y+=42){fill(393,y,5,17,'#303a3d');fill(897,y,5,17,'#343d3e')}
for(let x=0;x<W;x+=78){fill(x,350,40,2,'#9d9d8a40');fill(x+15,735,30,2,'#b3a99633')}
for(let i=0;i<9;i++){let x=135+i*110;stroke(x,410,x+18,408,'#2b3c4040',2);stroke(x+8,633,x+28,628,'#2b3c4040',2)}
for(const h of houses)house(h);
for(let x=0;x<1300;x+=52){if(x>380&&x<470||x>810&&x<920)continue;fill(x,290,44,6,'#8e8e82');fill(x,296,44,4,'#353d3d');fill(x,758,44,6,'#8e8e82');fill(x,764,44,4,'#353d3d')}
tree(370,275,44);tree(845,278,47);tree(372,807,37);tree(855,803,39);
for(let i=0;i<18;i++){let x=65+(i*79)%1190,y=i%2?780:280;ellipse(x,y,11,8,i%3?'#3a5448':'#49604c');ellipse(x+6,y-7,8,10,'#2f483e');fill(x-10,y+3,23,10,'#7a6e5d')}
for(const [x,y] of [[430,315],[866,315],[425,785],[880,780]]){fill(x-4,y-95,8,105,'#3b4248');fill(x-14,y-101,28,9,'#d5b98a');ellipse(x,y+4,18,5,'#151c20aa');let glow=C.createRadialGradient(x,y-95,4,x,y-95,155);glow.addColorStop(0,'#ffe0a55e');glow.addColorStop(.45,'#e7b4771e');glow.addColorStop(1,'#e7b47700');fill(x-160,y-255,320,320,glow)}
fill(1010,565,55,85,'#8b353b');fill(1016,572,43,43,'#c7c1a7');fill(1023,620,28,13,'#d7d0c0');fill(1020,655,12,8,'#1b242b');fill(1045,655,12,8,'#1b242b');
for(let i=0;i<7;i++){let x=70+i*180;stroke(x,430,x+14,420,'#2c3635',2);stroke(x,682,x+10,687,'#2c3635',2)}
}
function heroine(){const x=girl.x,y=girl.y;C.save();C.translate(x,y);let bob=Math.sin(girl.step)*2;ellipse(0,8,16,6,'#0a1118a0');C.translate(0,bob);
const side=girl.face===1||girl.face===3;const back=girl.face===0;
fill(-10,-13,8,20,'#292d39');fill(2,-13,8,20,'#292d39');fill(-13,-34,26,26,'#a89b93');fill(-17,-47,34,21,'#30313c');ellipse(0,-43,17,16,'#30313c');
if(!back){ellipse(0,-36,12,12,'#e6cbb5');if(side){ellipse(girl.face===1?6:-6,-35,1.5,2,'#33333c')}else{ellipse(-5,-35,1.6,2,'#34343b');ellipse(5,-35,1.6,2,'#34343b')}}
fill(-12,-21,24,24,'#eee0d0');poly([[-12,-17],[12,-17],[17,3],[-17,3]],'#a8a8b1');fill(-10,-20,20,6,'#f2e6d7');stroke(-9,-14,-13,0,'#e8d7c6',5);stroke(9,-14,13,0,'#e8d7c6',5);fill(-10,3,8,9,'#393c49');fill(3,3,8,9,'#393c49');C.restore()}
function show(msg){let e=document.getElementById('note');e.textContent=msg;e.style.opacity=1;noticeUntil=performance.now()+3200}
function act(){const spots=[{x:1035,y:630,r:85,s:'自動販売機。冷たい光だけが残っている。'},{x:430,y:315,r:70,s:'街灯の下に、誰かが立っていたような気がした。'},{x:370,y:275,r:75,s:'植木の葉が、風もないのに揺れている。'}];let near=spots.find(p=>Math.hypot(girl.x-p.x,girl.y-p.y)<p.r);show(near?near.s:'静かだ。遠くで犬が一度だけ吠えた。')}
function collision(x,y){if(x<30||x>W-30||y<315||y>742)return true;if((x>390&&x<462||x>820&&x<903)&&y<370)return false;return false}
let last=performance.now();function loop(now){let dt=Math.min((now-last)/16.67,2);last=now;t+=dt;let dx=joy.x,dy=joy.y;if(keys.has('ArrowLeft')||keys.has('KeyA'))dx--;if(keys.has('ArrowRight')||keys.has('KeyD'))dx++;if(keys.has('ArrowUp')||keys.has('KeyW'))dy--;if(keys.has('ArrowDown')||keys.has('KeyS'))dy++;let m=Math.hypot(dx,dy);if(m>.04){dx/=Math.max(1,m);dy/=Math.max(1,m);let sp=(run||keys.has('ShiftLeft')?3.1:1.75)*dt;let nx=girl.x+dx*sp,ny=girl.y+dy*sp;if(!collision(nx,girl.y))girl.x=nx;if(!collision(girl.x,ny))girl.y=ny;girl.face=Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0;girl.step+=dt*.22}else girl.step=0;
camera.x+=(girl.x-camera.x)*.08;camera.y+=(girl.y-camera.y)*.08;C.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);fill(0,0,vw,vh,'#0a111a');let z=Math.max(vw/800,vh/500);C.save();C.translate(vw/2-camera.x*z,vh/2-camera.y*z);C.scale(z,z);street();heroine();C.restore();
let vign=C.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.12,vw/2,vh/2,Math.max(vw,vh)*.72);vign.addColorStop(0,'#07101c18');vign.addColorStop(1,'#02060edc');fill(0,0,vw,vh,vign);
if(now>noticeUntil)document.getElementById('note').style.opacity=0;requestAnimationFrame(loop)}
const stick=document.getElementById('stick'),nub=document.getElementById('nub');function move(e){let r=stick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/44,y=(e.clientY-r.top-r.height/2)/44,m=Math.max(1,Math.hypot(x,y));joy.x=x/m;joy.y=y/m;nub.style.transform='translate('+(joy.x*38)+'px,'+(joy.y*38)+'px)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.id===e.pointerId)move(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,e=>{if(joy.id===e.pointerId){joy.id=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}});
document.getElementById('act').addEventListener('pointerdown',e=>{e.preventDefault();act()});const rb=document.getElementById('run');rb.addEventListener('pointerdown',e=>{e.preventDefault();run=true;rb.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])rb.addEventListener(ev,()=>run=false);
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'||e.code==='Space')act();if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();joy.x=joy.y=0;run=false});show('帰り道。誰もいない住宅街。');requestAnimationFrame(loop);
</script></body></html>
