<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>帰り灯 | Pixel Prototype 0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d17;color:#dce1e9;font-family:system-ui,sans-serif;overflow:hidden}#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#hud{position:absolute;top:12px;left:12px;background:#0a1121bc;padding:9px 12px;border:1px solid #344052;font-size:12px;pointer-events:none}#msg{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#0a1121e8;padding:9px 16px;min-width:200px;text-align:center;font-size:13px;border:1px solid #49546a;pointer-events:none}#touch{position:absolute;bottom:12px;left:12px;display:flex;gap:10px;align-items:end;user-select:none}.pad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(3,47px);gap:3px}.btn{background:#26364cbb;border:1px solid #8290a6;border-radius:10px;color:white;font-weight:bold;font-size:19px;touch-action:none}.btn:active{background:#6b7996}.actions{display:flex;gap:7px;margin-left:8px;margin-bottom:10px}.actions .btn{width:56px;height:54px;font-size:13px}#start{position:absolute;inset:0;background:#080e1bee;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#start>div{max-width:430px}#start h1{font-size:36px;letter-spacing:.28em;font-weight:400;color:#f0dfb5}#start button{font-size:17px;padding:12px 35px;background:#d8bd83;border:0;color:#10131a;border-radius:4px;cursor:pointer}#start p{line-height:1.8;font-size:14px;color:#b8c3d4}@media(min-width:900px){#touch{opacity:.35}}@media(max-height:470px){#msg{bottom:8px;left:55%}#touch{transform:scale(.75);transform-origin:bottom left}} .pad{display:block;width:150px;height:150px}#joystick{width:142px;height:142px;border-radius:50%;background:#25334d99;border:2px solid #9ba9b788;position:relative;touch-action:none}#knob{width:58px;height:58px;border-radius:50%;background:#9eabbcbb;border:2px solid #dce4e7;position:absolute;left:40px;top:40px;pointer-events:none;box-shadow:0 0 18px #0008} .actions{margin-bottom:20px}.actions .btn{width:70px;height:66px} </style></head><body><canvas id="game"></canvas><div id="hud">帰り灯 — 夜の住宅街 <span id="area"></span><br><span id="help">移動 WASD / 矢印　調べる E　走る Shift</span></div><div id="msg">静かな住宅街だ。</div><div id="touch"><div class="pad"><i></i><button class="btn" data-key="up">▲</button><i></i><button class="btn" data-key="left">◀</button><i></i><button class="btn" data-key="right">▶</button><i></i><button class="btn" data-key="down">▼</button><i></i></div><div class="actions"><button class="btn" data-key="run">走る</button><button class="btn" data-key="act">調べる</button></div></div><script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d',{alpha:false});const W=480,H=270;c.width=W;c.height=H;g.imageSmoothingEnabled=false;
const keys=new Set(),pressed=new Set();let stick={x:0,y:0,id:null};let player={x:185,y:145,dir:0,step:0},zone=0,frame=0,flash=0,msgTime=0;const areaNames=['古い住宅街','坂下の路地'];const road='#434953';
function say(s,t=240){document.getElementById('msg').textContent=s;msgTime=t}
function rng(seed){let n=seed;return()=>{n=(n*1664525+1013904223)>>>0;return n/4294967296}}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function line(x,y,w,h,col){rect(x,y,w,h,col)}
function makeZone(z){let r=rng(1209+z*97),houses=[],props=[],walls=[];let xs=z===0?[12,98,276,367]:[14,106,285,370];for(let row=0;row<3;row++){for(let col=0;col<4;col++){let x=xs[col]+(r()-.5)*9,y=16+row*93+(r()-.5)*13; if((row===1&&col===1)||(row===1&&col===2))continue;let w=52+r()*20,h=43+r()*13;houses.push({x,y,w,h,roof:Math.floor(r()*3),seed:Math.floor(r()*99)});walls.push({x:x-4,y:y+h+5,w:w+7,h:3})}}for(let i=0;i<27;i++)props.push({x:r()*W,y:r()*H,type:Math.floor(r()*4)});return{houses,props,walls}}
const zones=[makeZone(0),makeZone(1)];
function inRoad(x,y){return (x>76&&x<103)||(x>265&&x<290)||(y>91&&y<127)||(zone===1&&x>170&&x<194)}
function blocked(x,y){if(y<5||y>H-6)return true;let z=zones[zone];for(const h of z.houses)if(x>h.x-5&&x<h.x+h.w+5&&y>h.y-4&&y<h.y+h.h+7)return true;for(const w of z.walls)if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return true;return false}
function px(x,y,s,col){rect(x,y,s,s,col)}
function house(h){let{x,y,w,h:hh}=h;x=Math.round(x);y=Math.round(y);w=Math.round(w);hh=Math.round(hh);rect(x+2,y+8,w,hh,'#171e2c');rect(x,y+6,w,hh-5,'#78817d');rect(x+4,y+13,w-8,hh-17,'#535d5f');rect(x-4,y,w+8,16,['#454e62','#5d505b','#535d6a'][h.roof]);for(let j=0;j<4;j++)line(x+j*w/4,y+2,1,11,'#7c7a7a');rect(x+9,y+21,10,12,'#222d3c');rect(x+11,y+23,6,8,h.seed%4===0?'#c8a773':'#344457');rect(x+w-18,y+21,10,12,'#273044');rect(x+w-16,y+23,6,8,h.seed%3===0?'#c5a47a':'#35445b');rect(x+w/2-5,y+hh-13,12,13,'#292f39');rect(x+w/2-3,y+hh-10,8,10,'#525657');rect(x+w/2+3,y+hh-6,1,1,'#d9b878');rect(x+5,y+hh-4,w-10,2,'#252b37')}
function lamp(x,y){rect(x+3,y+4,2,22,'#171c2a');rect(x,y,9,5,'#bca979');rect(x+2,y+1,5,2,'#f3d8a0');let rad=g.createRadialGradient(x+4,y+4,0,x+4,y+4,37);rad.addColorStop(0,'#edc77c44');rad.addColorStop(1,'#edc77c00');g.fillStyle=rad;g.fillRect(x-34,y-34,76,76)}
function plant(x,y){rect(x-2,y+4,7,5,'#28362e');rect(x-4,y,11,7,'#263c39');rect(x,y-4,5,9,'#36544b');px(x+3,y,2,'#57705b')}
function scenery(){rect(0,0,W,H,'#333e45');for(let y=0;y<H;y+=11)for(let x=0;x<W;x+=13){let n=((x*31+y*17+zone*23)%17);if(n<3)px(x+3,y+2,1,'#495157')}rect(0,90,W,39,road);rect(72,0,36,H,road);rect(264,0,31,H,road);if(zone===1)rect(168,0,27,H,road);for(let y=0;y<H;y+=15){rect(71,y,2,8,'#777c76');rect(109,y,2,8,'#777c76');rect(262,y,2,8,'#777c76');rect(297,y,2,8,'#777c76')}for(let x=0;x<W;x+=17){rect(x,88,9,1,'#727674');rect(x,130,9,1,'#727674')}let z=zones[zone];for(const h of z.houses)house(h);for(const w of z.walls){rect(w.x,w.y,w.w,w.h,'#8c9186');rect(w.x,w.y+2,w.w,2,'#434b4d')}for(const p of z.props){if(z.houses.some(h=>p.x>h.x-4&&p.x<h.x+h.w+4&&p.y>h.y-5&&p.y<h.y+h.h+7))continue;if(p.type<2)plant(p.x,p.y);else if(p.type===2){rect(p.x,p.y,7,4,'#606b73');rect(p.x+1,p.y+1,5,1,'#a5aba8')}else{rect(p.x,p.y,3,2,'#8a8b78')}}for(let x=0;x<W;x+=23){rect(x,126,10,1,'#666d70');rect(x+2,129,3,1,'#30383e')}for(let y=0;y<H;y+=19){rect(103,y,2,8,'#232c33');rect(289,y,2,8,'#232c33')}for(let i=0;i<20;i++){let x=(i*73+19)%W,y=(i*47+31)%H;if(!inRoad(x,y)){rect(x,y,7,3,'#263a34');rect(x+2,y-3,3,4,'#3c5545')}}lamp(111,130);lamp(298,87);if(zone===1){rect(205,134,20,14,'#3a535d');rect(207,135,16,11,'#9e3e40');rect(209,137,12,5,'#c0b5a1');rect(209,144,12,2,'#b6c4b6')}}
function hero(){let x=Math.round(player.x),y=Math.round(player.y),bob=Math.floor(Math.sin(player.step)*1.2);rect(x-5,y+2,11,3,'#13192388');rect(x-3,y-12+bob,7,6,'#433d42');rect(x-4,y-10+bob,9,7,'#bca494');rect(x-3,y-13+bob,7,3,'#272d3b');rect(x-4,y-4+bob,9,8,'#8b4f56');rect(x-2,y+4+bob,3,4,'#252a38');rect(x+2,y+4-bob,3,4,'#252a38');if(player.dir===1){px(x+2,y-8+bob,1,'#252b34')}else if(player.dir===3){px(x-2,y-8+bob,1,'#252b34')}else if(player.dir===2){px(x-2,y-8+bob,1,'#252b34');px(x+2,y-8+bob,1,'#252b34')}}
function draw(){g.save();let scale=Math.max(innerWidth/W,innerHeight/H);let viewW=innerWidth/scale,viewH=innerHeight/scale;g.clearRect(0,0,W,H);scenery();hero();let vignette=g.createRadialGradient(player.x,player.y,17,player.x,player.y,135);vignette.addColorStop(0,'#08102200');vignette.addColorStop(1,'#030713c9');g.fillStyle=vignette;g.fillRect(0,0,W,H);g.restore();document.getElementById('area').textContent=' / '+areaNames[zone]}
function interact(){let spots=[{x:111,y:130,s:'古い街灯。虫の羽音だけが聞こえる。'},{x:298,y:87,s:'光の届かない路地が続いている。'},{x:213,y:143,s:'古びた自動販売機。売り切れの赤いランプ。'}];let a=spots.filter(v=>zone===1||v.x!==213).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(a&&Math.hypot(a.x-player.x,a.y-player.y)<35)say(a.s);else say('近くに調べられるものはない。',100)}
let last=0;function tick(t){let dt=Math.min((t-last)/16.67||1,2);last=t;frame++;let dx=0,dy=0;if(keys.has('left'))dx--;if(keys.has('right'))dx++;if(keys.has('up'))dy--;if(keys.has('down'))dy++;if(stick.id!==null){dx=stick.x;dy=stick.y}if(dx||dy){let m=Math.max(1,Math.hypot(dx,dy)),s=(keys.has('run')?1.85:1.12)*dt;dx=dx/m*s;dy=dy/m*s;if(dx>0)player.dir=1;else if(dx<0)player.dir=3;else if(dy>0)player.dir=2;else player.dir=0;let nx=player.x+dx,ny=player.y+dy;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;player.step+=.17*dt;if(player.x>W-5){zone=1-zone;player.x=7;say('隣の通りへ出た。')}else if(player.x<5){zone=1-zone;player.x=W-7;say('隣の通りへ出た。')}}if(pressed.has('act'))interact();pressed.clear();if(msgTime>0)msgTime-=dt;else document.getElementById('msg').textContent='E / 調べる：近くのものを調査';draw();requestAnimationFrame(tick)}
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ShiftLeft:'run',ShiftRight:'run',KeyE:'act',Space:'act'};window.addEventListener('keydown',e=>{let k=map[e.code];if(k){e.preventDefault();if(!keys.has(k))pressed.add(k);keys.add(k)}});window.addEventListener('keyup',e=>{let k=map[e.code];if(k)keys.delete(k)});window.addEventListener('blur',()=>keys.clear());for(const b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys.has(k))pressed.add(k);keys.add(k)});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{e.preventDefault();keys.delete(k)})}const pad=document.querySelector('.pad');pad.innerHTML='<div id="joystick"><div id="knob"></div></div>';const joy=pad.querySelector('#joystick'),knob=pad.querySelector('#knob');function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/(r.width*.36),y=(e.clientY-cy)/(r.height*.36),m=Math.max(1,Math.hypot(x,y));stick.x=x/m;stick.y=y/m;knob.style.transform=`translate(${stick.x*36}px,${stick.y*36}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();stick.id=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(stick.id===e.pointerId)joyMove(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(ev,e=>{if(stick.id===e.pointerId){stick.id=null;stick.x=stick.y=0;knob.style.transform='translate(0,0)'}});say('誰もいない夜道。どこかで電線が鳴っている。');window.addEventListener('resize',()=>{});requestAnimationFrame(tick);
</script></body></html>
