<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>帰り灯 KAERIBI | レイヤーマップ v2.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;position:fixed;inset:0;background:#03090d;color:#e9dfce;overflow:hidden;overscroll-behavior:none;font-family:serif;touch-action:none;-webkit-overflow-scrolling:auto}canvas{width:100vw;height:100dvh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}#ui{position:fixed;top:calc(14px + env(safe-area-inset-top));left:17px;text-shadow:0 2px 10px #000;font-size:12px;letter-spacing:.13em;pointer-events:none}#ui strong{font-size:21px;font-weight:normal;letter-spacing:.2em}#msg{position:fixed;bottom:175px;left:50%;transform:translateX(-50%);background:#071017ed;border:1px solid #b6aa8770;padding:14px 20px;text-align:center;font-size:14px;min-width:240px;max-width:85vw;opacity:0;transition:opacity .2s;pointer-events:none}#pad{position:fixed;left:14px;bottom:calc(38px + env(safe-area-inset-bottom));width:178px;height:178px;border-radius:50%;background:#cbd5d61a;border:1px solid #d8ddd977;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#nub{position:absolute;left:67px;top:67px;width:44px;height:44px;border-radius:50%;background:#d0d7d58c;pointer-events:none}button{position:fixed;right:25px;bottom:calc(64px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:#263b45cc;border:1px solid #ddd1b08c;color:#fff4dd;font-size:13px}#run{right:112px;bottom:calc(28px + env(safe-area-inset-bottom));width:58px;height:58px}@media(pointer:fine){#pad,button{opacity:.5}}</style></head><body>
<canvas id="scene"></canvas><div id="ui"><strong>帰り灯</strong><br>KAERIBI — 夜の路地<br><small>レイヤーマップ / v2.1</small></div><div id="msg"></div><div id="pad"><div id="nub"></div></div>
<script>
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D}addEventListener('resize',resize);resize();
const TILE=64,COLS=32,ROWS=24,MW=COLS*TILE,MH=ROWS*TILE;
const tiles=Array.from({length:ROWS},()=>Array(COLS).fill(0)); // 0 = blocked garden, 1 = asphalt, 2 = driveway
function paint(x,y,w,h,t){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(tiles[j]?.[i]!==undefined)tiles[j][i]=t}
paint(0,10,32,5,1);paint(12,0,5,24,1);paint(23,0,4,24,1);paint(1,3,7,7,2);paint(18,4,5,6,2);paint(17,16,6,7,2);
// Each scene object has a persistent ID, independent collision and event state.
const objects=[
 {id:'home_nw',type:'house',x:65,y:60,w:390,h:320},
 {id:'home_north',type:'house',x:520,y:35,w:215,h:425},
 {id:'home_ne',type:'house',x:1110,y:70,w:320,h:410},
 {id:'home_far_east',type:'house',x:1730,y:85,w:280,h:420},
 {id:'home_sw',type:'house',x:55,y:1010,w:560,h:490},
 {id:'home_south',type:'house',x:1080,y:1050,w:330,h:450},
 {id:'home_se',type:'house',x:1770,y:1040,w:260,h:450},
 {id:'vending_01',type:'vending',x:820,y:554,w:52,h:77,state:'upright',event:'vending_fall',collidable:true},
 {id:'car_park_01',type:'car',x:155,y:270,w:125,h:190},
 {id:'car_park_02',type:'car',x:1190,y:340,w:125,h:185},
 {id:'fence_west',type:'fence',x:740,y:130,w:22,h:380},
 {id:'fence_east',type:'fence',x:1470,y:125,w:24,h:390},
 {id:'tree_01',type:'tree',x:420,y:470,w:85,h:85},
 {id:'tree_02',type:'tree',x:1030,y:320,w:90,h:90},
 {id:'tree_03',type:'tree',x:1620,y:460,w:80,h:80}
];
const objectById=new Map(objects.map(o=>[o.id,o]));
const eventDefinitions={
 vending_fall:{once:true,trigger:'proximity',radius:125,chancePerSecond:0.012,
  guard:o=>o.state==='upright',
  run:o=>{o.state='falling';o.anim=0;eventHistory.add(o.id+':vending_fall');}}
};
const eventHistory=new Set();
function updateWorld(dt){
 for(const o of objects){
  if(o.state==='falling'){o.anim=Math.min(1,(o.anim||0)+dt*1.8);if(o.anim>=1)o.state='fallen'}
  if(!o.event)continue;
  const e=eventDefinitions[o.event];if(!e||!e.guard(o)||(e.once&&eventHistory.has(o.id+':'+o.event)))continue;
  if(Math.hypot(player.x-(o.x+o.w/2),player.y-(o.y+o.h/2))<e.radius && Math.random()<e.chancePerSecond*dt)e.run(o);
 }
}
function objectBounds(o){
 if(o.type==='vending'&&(o.state==='falling'||o.state==='fallen'))return {x:o.x-48,y:o.y+o.h-34,w:o.w+48,h:34};
 return o;
}
const player={x:960,y:785,dir:'down',step:0};
let joy={x:0,y:0,id:null,dash:false},keys=new Set(),last=performance.now(),time=0;
const rnd=(x,y,k=1)=>{let n=Math.sin(x*127.1+y*311.7+k*74.7)*43758.5453;return n-Math.floor(n)};
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x,y,xx,yy,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function tileDraw(i,j){const x=i*TILE,y=j*TILE,t=tiles[j][i];box(x,y,TILE,TILE,t===1?'#292f34':t===2?'#44413a':'#172923');for(let k=0;k<20;k++){let px=x+rnd(i,j,k)*64,py=y+rnd(j,i,k+20)*64;box(px,py,1+rnd(k,i)*2,1,t===0?'#46604450':'#8d918350')}if(t===1){if(tiles[j-1]?.[i]===0){box(x,y,64,5,'#8b8675');line(x,y+8,x+64,y+8,'#5d5b53')}if(tiles[j+1]?.[i]===0)box(x,y+59,64,5,'#888275')}if(t===2){for(let a=0;a<3;a++)line(x,y+17+a*18,x+64,y+17+a*18,'#70695a28')}}
function drawHouse(o){const {x,y,w,h}=o;box(x+12,y+17,w,h,'#0b131a');box(x,y+30,w,h-30,'#4b4b47');for(let yy=y+40;yy<y+h;yy+=32){line(x+3,yy,x+w-3,yy,'#272c32',2);for(let xx=x+12;xx<x+w;xx+=52)line(xx,yy,xx-13,yy+31,'#30383d',1.4)}ctx.fillStyle='#202d39';ctx.beginPath();ctx.moveTo(x-24,y+48);ctx.lineTo(x+w/2,y-65);ctx.lineTo(x+w+24,y+48);ctx.closePath();ctx.fill();for(let a=0;a<14;a++){let yy=y-40+a*6;line(x+w/2-(a*18),yy,x+w/2+(a*18),yy,'#46515a55',1.5)}box(x+w*.18,y+h-65,45,52,'#b99c64');box(x+w*.18+5,y+h-60,35,42,'#ebba6480');box(x+w*.72,y+h-65,38,50,'#161c20');line(x+w*.72+19,y+h-65,x+w*.72+19,y+h-15,'#77756a',3)}
function drawObject(o){const {x,y,w,h}=o;if(o.type==='house')return drawHouse(o);
if(o.type==='vending'){if(o.state==='fallen'||o.state==='falling'){ctx.save();ctx.translate(x+o.w/2,y+o.h-8);ctx.rotate(-Math.PI/2*Math.min(1,o.anim||1));ctx.translate(-(x+o.w/2),-(y+o.h-8))}box(x+5,y+8,w,h,'#121719');box(x,y,w,h-4,'#a63435');box(x+7,y+8,w-14,h*.48,'#b4d5d3');for(let a=0;a<12;a++)box(x+10+(a%4)*9,y+12+Math.floor(a/4)*10,5,8,['#e6a775','#93b0d2','#f1e2b5'][a%3]);box(x+7,y+h-24,w-14,13,'#aeb2aa');box(x+36,y+h-21,8,7,'#242d32');if(o.state==='fallen'||o.state==='falling')ctx.restore();return}
if(o.type==='car'){ellipse(x+w/2,y+h-10,w*.58,25,'#0009');box(x+12,y+13,w-24,h-24,'#64665e');box(x+21,y+30,w-42,50,'#26323a');box(x+20,y+h-60,w-40,38,'#7c7a6c');box(x+5,y+30,13,32,'#1c2022');box(x+w-18,y+30,13,32,'#1c2022');box(x+18,y+h-16,21,7,'#a94b40');box(x+w-39,y+h-16,21,7,'#a94b40');return}
if(o.type==='fence'){box(x,y,w,h,'#54544a');for(let k=10;k<h;k+=23)line(x,y+k,x+w,y+k,'#242c2e',3);return}
if(o.type==='tree'){ellipse(x+w/2,y+h/2,w*.75,h*.65,'#0a1511');for(let k=0;k<19;k++){let xx=x+rnd(k,x)*w,yy=y+rnd(k,y)*h;ellipse(xx,yy,10+rnd(k,y)*15,9+rnd(k,x)*13,['#1b3327','#294333','#3b4a2c','#172a25'][k%4])}}}
function occupied(x,y){return objects.some(o=>{if(o.collidable===false)return false;const b=objectBounds(o);return x>b.x-7&&x<b.x+b.w+7&&y>b.y-6&&y<b.y+b.h+6})}
function pass(x,y){const r=9;return [[0,0],[-r,0],[r,0],[0,-r],[0,r]].every(([dx,dy])=>{let a=x+dx,b=y+dy,i=Math.floor(a/TILE),j=Math.floor(b/TILE);return a>=0&&b>=0&&a<MW&&b<MH&&tiles[j]?.[i]>0&&!occupied(a,b)})}
function character(){let x=player.x,y=player.y,bob=Math.sin(player.step)*2;ellipse(x,y+1,14,5,'#0009');box(x-12,y-34+bob,24,30,'#8d5e5a');box(x-11,y-6+bob,9,8,'#313a46');box(x+2,y-6+bob,9,8,'#313a46');ellipse(x,y-38+bob,15,16,'#c5a69a');ellipse(x,y-49+bob,16,10,'#25232d');box(x-15,y-50+bob,30,7,'#292832')}
function frame(ts){const dt=Math.min((ts-last)/1000,.05);last=ts;time=ts;updateWorld(dt);let dx=joy.x,dy=joy.y;if(keys.has('ArrowLeft')||keys.has('KeyA'))dx--;if(keys.has('ArrowRight')||keys.has('KeyD'))dx++;if(keys.has('ArrowUp')||keys.has('KeyW'))dy--;if(keys.has('ArrowDown')||keys.has('KeyS'))dy++;let n=Math.hypot(dx,dy);if(n>.08){dx/=Math.max(1,n);dy/=Math.max(1,n);const sp=(joy.dash||keys.has('ShiftLeft')||keys.has('ShiftRight')?210:120)*dt;for(let k=0;k<Math.ceil(sp/3);k++){let d=sp/Math.ceil(sp/3);if(pass(player.x+dx*d,player.y))player.x+=dx*d;if(pass(player.x,player.y+dy*d))player.y+=dy*d}player.dir=Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up';player.step+=dt*11}
ctx.setTransform(D,0,0,D,0,0);box(0,0,W,H,'#071019');const z=Math.max(W/1000,H/710);ctx.save();ctx.translate(W/2-player.x*z,H/2-player.y*z);ctx.scale(z,z);
for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++)tileDraw(i,j);
for(const o of objects.filter(o=>o.type==='house'||o.type==='car'||o.type==='vending'||o.type==='fence'))drawObject(o);
character();for(const o of objects.filter(o=>o.type==='tree'))drawObject(o);
for(const [x,y] of [[830,695],[1550,710],[940,1220]]){let g=ctx.createRadialGradient(x,y,3,x,y,260);g.addColorStop(0,'#e6b06a35');g.addColorStop(1,'#e6b06a00');box(x-260,y-260,520,520,g);ellipse(x,y,9,6,'#f5d18a')}
ctx.restore();let g=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0000');g.addColorStop(1,'#000b');box(0,0,W,H,g);requestAnimationFrame(frame)}
const pad=document.getElementById('pad'),nub=document.getElementById('nub');
const zone=document.createElement('div');zone.style.cssText='position:fixed;left:0;bottom:0;width:65vw;height:45dvh;z-index:8;touch-action:none;overscroll-behavior:none';document.body.appendChild(zone);pad.style.pointerEvents='none';pad.style.zIndex='9';
function move(e){let r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/60,y=(e.clientY-r.top-r.height/2)/60,m=Math.hypot(x,y),d=Math.max(1,m);joy.x=x/d;joy.y=y/d;joy.dash=m>.78;nub.style.transform='translate('+(joy.x*61)+'px,'+(joy.y*61)+'px)';nub.style.background=joy.dash?'#efbc76':'#d0d7d58c'}
zone.addEventListener('pointerdown',e=>{e.preventDefault();if(joy.id!==null)return;joy.id=e.pointerId;zone.setPointerCapture(e.pointerId);move(e)});
zone.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();move(e)}});
for(const t of ['pointerup','pointercancel','lostpointercapture'])zone.addEventListener(t,e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;joy.dash=false;nub.style.transform='none'}});
addEventListener('keydown',e=>{keys.add(e.code);if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));
document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});addEventListener('gesturestart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
requestAnimationFrame(frame);
</script></body></html>
