function move(e){const r=pad.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/40,y=(e.clientY-r.top-r.height/2)/40,raw=Math.hypot(x,y),m=Math.max(1,raw);joy.x=x/m;joy.y=y/m;joy.dash=raw>.78;pad.style.borderColor=joy.dash?'#f3c47b':'#d8ddd977';nub.style.background=joy.dash?'#f3c47b':'#d0d7d58c';nub.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}
pad.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;pad.setPointerCapture(e.pointerId);move(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)move(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(type,e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;joy.dash=false;nub.style.transform='none';nub.style.background='#d0d7d58c';pad.style.borderColor='#d8ddd977'}});

document.getElementById('act').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'||e.code==='KeyE')interact();if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();joy.x=joy.y=0;joy.dash=false;running=false});
say('街灯が照らす、帰り道。');requestAnimationFrame(frame);
