<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060c17">
<title>帰り灯 KAERIBI — 第一夜 雪の街角 v5.0</title>
<style>
:root{color-scheme:dark;--paper:#e7e0d5;--dim:#b6b5b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b14;color:var(--paper);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;touch-action:none;overscroll-behavior:none;position:fixed;inset:0;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 20px);left:23px;pointer-events:none;text-shadow:0 2px 12px #03050a,0 2px 4px #03050b}
#hud h1{font-weight:400;letter-spacing:.34em;font-size:27px;margin:0;line-height:1.35}
#hud p{margin:3px 0 0;font-size:10px;letter-spacing:.21em;opacity:.75}
#progress{margin-top:18px;font-size:12px;letter-spacing:.12em;opacity:.92}
#caption{font-size:12px;opacity:.7}
#dialog{position:fixed;bottom:calc(25% + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,10px);width:min(90vw,520px);padding:15px 22px;border:1px solid #b4ad9977;background:#060e18df;box-shadow:0 4px 28px #000a;text-align:center;font-size:14px;line-height:1.9;letter-spacing:.055em;opacity:0;pointer-events:none;transition:opacity .27s,transform .27s;z-index:15}
#dialog.visible{opacity:1;transform:translate(-50%,0)}
#zone{position:fixed;bottom:0;left:0;width:56vw;height:46dvh;max-width:400px;z-index:12;touch-action:none;overscroll-behavior:none}
#pad{position:fixed;left:26px;bottom:calc(51px + env(safe-area-inset-bottom));height:152px;width:152px;border-radius:50%;border:1px solid #dce2d46c;background:#afc3cc20;box-shadow:0 0 22px #0006,inset 0 0 33px #a8b5c40a;pointer-events:none;transition:border-color .2s;z-index:13}
#pad.engaged{border-color:#d3dcc7a4}
#pad.running{border-color:#e5ca95bb;background:#a49e842c}
#nub{position:absolute;left:50%;top:50%;margin-left:-24px;margin-top:-24px;width:48px;height:48px;border-radius:50%;background:#cad5d5aa;border:1px solid #edf0ecc0;box-shadow:0 2px 12px #0008;pointer-events:none}
.action{position:fixed;right:23px;bottom:calc(56px + env(safe-area-inset-bottom));min-height:75px;min-width:75px;padding:12px 16px;border-radius:45px;background:#142633d9;color:#fff1d8;border:1px solid #d8c39d86;font-family:inherit;font-size:12px;line-height:1.6;letter-spacing:.08em;z-index:14;touch-action:manipulation;cursor:pointer}
#act{opacity:0;pointer-events:none;transition:opacity .18s}
#act.visible{opacity:1;pointer-events:auto}
#prompt{position:fixed;right:20px;bottom:calc(215px + env(safe-area-inset-bottom));width:145px;min-height:15px;text-align:center;font-size:11px;text-shadow:0 2px 9px #000;color:#f2e8d5;pointer-events:none;z-index:14}
#light{bottom:calc(148px + env(safe-area-inset-bottom));width:48px;height:48px;min-height:48px;min-width:48px;padding:0;border-radius:50%;font-size:20px;color:#aabdc7;border-color:#82909a66;background:#102230aa}
#light.on{border-color:#dfc78f;color:#ffe5a8;box-shadow:0 0 24px #edca7c66}
#help{position:fixed;right:20px;top:calc(env(safe-area-inset-top) + 22px);color:#d2d6d1a8;font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.07em;text-shadow:0 2px 9px #000;pointer-events:none;text-align:right}
#loadStatus{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030810;z-index:22;font-size:14px;letter-spacing:.15em}
#loadStatus.hidden{display:none}
#ending{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#162234f8,#02040af9);z-index:25;text-align:center;padding:30px}
#ending.visible{display:flex}
#ending .end-title{font-size:34px;letter-spacing:.28em;font-weight:400;margin:0 0 20px}
#ending p{font-size:14px;line-height:2.1;letter-spacing:.16em;opacity:.85}
#ending small{letter-spacing:.12em;color:#c3b7a0}
#restart{font:inherit;font-size:13px;letter-spacing:.13em;background:transparent;border:1px solid #b9b39a85;color:#e5dfd0;padding:14px 35px;margin-top:35px;border-radius:2px}
body.debug #help{color:#e9cc75}
@media(pointer:fine){#zone,#pad{opacity:.32}#help{font-size:12px}#dialog{bottom:10%}}
@media(max-height:620px){#pad{width:125px;height:125px;bottom:calc(16px + env(safe-area-inset-bottom))}#hud h1{font-size:20px}#progress{margin-top:5px}#light{bottom:calc(120px + env(safe-area-inset-bottom))}#dialog{bottom:28%}}
</style>
</head>
<body>
<canvas id="scene" aria-label="冬の住宅街を歩く探索ゲーム"></canvas>
<div id="hud"><h1>帰り灯</h1><p>KAERIBI　/　第一夜・雪の街角</p><div id="progress"></div><div id="caption"></div></div>
<div id="help">歩く　左スティック / WASD<br>走る　外周 / Shift<br>調べる　近づいてタップ / E<br>懐中電灯　◈ / F</div>
<div id="dialog" role="status" aria-live="polite"></div>
<div id="zone" aria-label="移動スティックの操作領域"></div><div id="pad"><div id="nub"></div></div>
<div id="prompt"></div><button id="act" class="action" type="button">調べる</button><button id="light" class="action" aria-label="懐中電灯を切り替える" aria-pressed="false" type="button">◈</button>
<div id="loadStatus">雪の街角を準備しています…</div>
<div id="ending"><h2 class="end-title">帰り灯</h2><p>雪の夜、帰り道を見つけた。<br>けれど、家の灯りはひとつ多かった。</p><small>第一夜・街角 — つづく</small><button id="restart" type="button">もう一度歩く</button></div>
<script src="game_v5.js?v=500"></script>
</body>
</html>
