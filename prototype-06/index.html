<title>帰り灯 — 歩行・住宅街 基礎検証 06</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101921;color:#e8f0ed;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}#interface{pointer-events:none;position:fixed;inset:0}#heading{position:absolute;top:max(15px,env(safe-area-inset-top));left:18px;font-size:17px;letter-spacing:.12em;text-shadow:0 2px 12px #000b;font-weight:600}.sub{display:block;font-weight:400;letter-spacing:.07em;font-size:10px;opacity:.8;padding-top:6px}#status{position:absolute;right:14px;top:max(17px,env(safe-area-inset-top));font-variant-numeric:tabular-nums;font-size:11px;line-height:1.6;opacity:.8;text-shadow:0 1px 9px #000}#stick{position:absolute;bottom:max(26px,env(safe-area-inset-bottom) + 8px);left:22px;width:158px;height:158px;border-radius:50%;border:1px solid #f6fbff48;background:#b7c9de1a;box-shadow:inset 0 0 38px #b6c7dd0a,0 5px 32px #02050966;pointer-events:auto;touch-action:none;user-select:none}#stickInner{position:absolute;left:50%;top:50%;width:66px;height:66px;border-radius:50%;background:#edf5ff4d;border:1px solid #fff9;transform:translate(-50%,-50%);box-shadow:0 2px 10px #0005;pointer-events:none}#hint{position:absolute;left:16px;right:16px;bottom:max(199px,env(safe-area-inset-bottom) + 190px);font-size:11px;letter-spacing:.05em;text-align:center;opacity:.75;text-shadow:0 1px 10px #000}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:17px 22px;background:#111c29ed;border:1px solid #879aa84a;border-radius:10px;font-size:12px;text-align:center;opacity:1;transition:opacity .3s ease}#loading.hidden{opacity:0;pointer-events:none}@media(min-width:900px){#stick{opacity:.47}#hint{bottom:20px}}@media(max-height:560px){#hint{display:none}}

<script>
/* KAERIBI geometry revision 03.
   All blocking objects have a visible silhouette. No navmesh-painted hidden walls.
   Road, driveways, property boundary, and every collider have one shared source.
*/
(() => {
'use strict';
const W=1280,H=960;
const R=(x,y,w,h)=>({x,y,w,h});
const items=[
 {id:'house',type:'house',body:R(574,332,340,164),roof:[[531,358],[585,232],[902,232],[950,355],[914,383],[557,383]],baseY:496},
 {id:'fenceBack',type:'fence',body:R(520,190,455,14),baseY:204},
 {id:'fenceWest',type:'fence',body:R(520,190,16,392),baseY:582},
 {id:'fenceEast',type:'fence',body:R(960,190,16,392),baseY:582},
 {id:'fenceFrontLeft',type:'fence',body:R(520,571,202,19),baseY:590},
 {id:'fenceFrontRight',type:'fence',body:R(822,571,154,19),baseY:590},
 {id:'car',type:'car',body:R(66,328,99,175),baseY:503},
 {id:'vending',type:'vending',body:R(1104,552,72,47),baseY:599},
 {id:'lamp',type:'lamp',body:R(438,564,14,14),baseY:578},
 {id:'potsA',type:'pots',body:R(545,533,64,25),baseY:558},
 {id:'potsB',type:'pots',body:R(895,533,64,25),baseY:558},
];
const surfaces=[
 {id:'streetEastWest',type:'road',rect:R(0,603,W,214)},
 {id:'streetNorthSouth',type:'road',rect:R(214,0,210,H)},
 {id:'parking',type:'parking',rect:R(18,240,174,364)},
 {id:'driveway',type:'paving',rect:R(720,496,104,107)},
 {id:'courtyard',type:'property',rect:R(522,204,450,369)},
 {id:'vendingPad',type:'paving',rect:R(1074,588,126,42)},
];
function intersects(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y}
function overFoot(x,y,rx=10,ry=6,rect){
 const nx=Math.min(rect.x+rect.w,Math.max(rect.x,x)),ny=Math.min(rect.y+rect.h,Math.max(rect.y,y));
 return ((x-nx)/rx)**2 + ((y-ny)/ry)**2 < 1;
}
function blocked(x,y,rx=10,ry=6){
 return x-rx<8||y-ry<8||x+rx>W-8||y+ry>H-8||items.some(o=>overFoot(x,y,rx,ry,o.body));
}
const town={W,H,items,surfaces,blocked,overFoot,intersects,start:{x:745,y:708},gate:{left:722,right:822,y:581},entrance:{x:772,y:503}};
Object.freeze(town.items);Object.freeze(town.surfaces);window.KAERIBI_TOWN=town;
})();

</script>

function fillRect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}
function stroke(c,x1,y1,x2,y2,color,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function polygon(c,pts,fill,outline=null,ow=1){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(outline){c.strokeStyle=outline;c.lineWidth=ow;c.stroke()}}
function ellipse(c,x,y,rx,ry,fill){c.fillStyle=fill;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
function buildGround(){
 let grad=b.createLinearGradient(0,0,T.W,T.H);grad.addColorStop(0,'#18272e');grad.addColorStop(.5,'#283b3d');grad.addColorStop(1,'#172530');fillRect(b,0,0,T.W,T.H,grad);
 // Snow-speckled yards, never crossing pavement boundaries.
 for(let i=0;i<2700;i++){
  const x=rnd(i*21.8)*T.W,y=rnd(i*71.1)*T.H;
  const paved=T.surfaces.some(s=>x>=s.rect.x&&x<=s.rect.x+s.rect.w&&y>=s.rect.y&&y<=s.rect.y+s.rect.h&&s.type!=='property');
  if(paved)continue;
  ellipse(b,x,y,1+rnd(i+7)*5,1+rnd(i+8)*2,i%4?'#80949225':'#c8d7cf28');
 }
 const r=T.surfaces.find(s=>s.id==='streetEastWest').rect,v=T.surfaces.find(s=>s.id==='streetNorthSouth').rect,p=T.surfaces.find(s=>s.id==='parking').rect;
 fillRect(b,r.x,r.y,r.w,r.h,'#34424a');fillRect(b,v.x,v.y,v.w,v.h,'#34424a');
 fillRect(b,p.x,p.y,p.w,p.h,'#64777b');
 fillRect(b,520,188,456,382,'#304545');
 fillRect(b,541,205,415,356,'#374c49');
 fillRect(b,718,497,106,109,'#7c8984');
 fillRect(b,1070,587,132,40,'#7c8884');
 // Garage apron: parking physically connects to street without a curb barrier.
 fillRect(b,18,591,176,28,'#6d7f80');
 // drain geometry follows road edge and intentionally stops for accesses.
 for(let x=0;x<T.W;x+=74){if(x<202||x>455)stroke(b,x,595,x+45,595,'#a6b4b342',2);}
 stroke(b,0,602,200,602,'#a1b0aa84',3);stroke(b,430,602,700,602,'#a1b0aa84',3);
 stroke(b,830,602,1280,602,'#a1b0aa84',3);stroke(b,0,817,1280,817,'#9ba9aa94',3);
 stroke(b,208,0,208,591,'#899b9c82',4);stroke(b,430,0,430,591,'#a7b6b68a',4);
 // Parked car: white lot markings aligned with drive-in direction.
 stroke(b,36,260,36,577,'#dae4e2a3',3);stroke(b,181,260,181,577,'#dae4e2a3',3);
 stroke(b,36,260,181,260,'#dae4e266',2);stroke(b,52,282,91,282,'#c1cfcf55',4);stroke(b,124,282,164,282,'#c1cfcf55',4);
 // House path and gate underlay, also used for actual unobstructed entrance.
 for(let y=502;y<578;y+=22)stroke(b,732,y,810,y,'#c2d0c79a',2);
 stroke(b,732,497,732,591,'#d1dad270',2);stroke(b,811,497,811,591,'#d1dad270',2);
 // Roads: no oversized decals, no inaccessible decorative strips.
 for(let i=0;i<95;i++){
  const x=rnd(i*9.13)*T.W,y=620+rnd(i*31.2)*170;
  fillRect(b,x,y,8+rnd(i)*20,1,'#a6b8b71b');
 }
 for(let x=470;x<1260;x+=135)stroke(b,x,723,x+58,723,'#c5d5d32a',2);
 // snow rests by the fence and along private lot, not across walkable paths.
 for(let i=0;i<54;i++){
  const x=485+rnd(i*53)*520,y=180+rnd(i*17)*35;
  ellipse(b,x,y,9+rnd(i+9)*24,2+rnd(i+13)*6,'#e6eee9a6');
 }
 // planted snow wedges outline garden away from entrance.
 for(let i=0;i<45;i++){
  const x=530+rnd(i*43)*430,y=510+rnd(i*93)*60;
  if(x>710&&x<830)continue;
  ellipse(b,x,y,7+rnd(i)*14,2+rnd(i+4)*5,'#d8e3de91');
 }
}

 }
 fillRect(c,730,412,82,86,'#292e35');fillRect(c,737,419,68,77,'#605259');fillRect(c,788,461,6,6,'#dbb58c');

 const pts=o.roof;
 polygon(c,pts,'#293e4b','#a9b9b7',3);
 // consistent shingle direction and ridge, snow on top plane.
 for(let i=0;i<9;i++)stroke(c,550+i*42,360,587+i*34,235,'#cad6d32d',2);
 for(let j=0;j<4;j++)stroke(c,548,270+j*26,925,270+j*26,'#152a3940',1);
 polygon(c,[[580,235],[899,235],[915,264],[563,264]],'#c9d8d2ac');
 ellipse(c,618,345,74,7,'#e5eee8ae');ellipse(c,840,354,75,7,'#e5eee8b4');

 fillRect(c,q.x+2,q.y+4,q.w,q.h,'#192a32ac');fillRect(c,q.x,q.y,q.w,q.h,'#718482');

 if(!vertical){for(let x=q.x+25;x<q.x+q.w;x+=28)stroke(c,x,q.y+5,x,q.y+q.h,'#283e49a3',2)}
 else {for(let y=q.y+30;y<q.y+q.h;y+=28)stroke(c,q.x,y,q.x+q.w,y,'#283e49a3',2)}

function drawCar(c,o){
 const q=o.body,x=q.x,y=q.y,w=q.w,h=q.h;
 fillRect(c,x-7,y+23,w+14,h-44,'#121c23b9');fillRect(c,x,y,w,h,'#596e77');
 fillRect(c,x+8,y+12,w-16,h-24,'#8c9c9c');fillRect(c,x+11,y+32,w-22,49,'#244357');
 fillRect(c,x+11,y+98,w-22,37,'#4b6570');
 fillRect(c,x+15,y+145,w-30,14,'#b8c8c3');
 for(const tx of [x-6,x+w-1])for(const ty of [y+30,y+125])fillRect(c,tx,ty,7,24,'#17232a');

 fillRect(c,x-2,y-92,q.w+5,q.h+92,'#0c1d2a93');
 fillRect(c,x,y-113,q.w,160,'#bdcbd0');fillRect(c,x+5,y-108,q.w-10,105,'#e5eee9');
 fillRect(c,x+9,y-100,q.w-18,76,'#6f99a5');
 for(let i=0;i<12;i++){

  fillRect(c,x+12+col*12,y-96+row*24,8,17,['#8e6668','#8cae9b','#d6bea0'][i%3]);
 }
 fillRect(c,x+8,y-14,q.w-16,9,'#324e5c');
 fillRect(c,x+48,y-31,12,15,'#758f9b');fillRect(c,x+7,y+9,q.w-14,25,'#4d6570');

 ellipse(c,x,y-197,20,8,'#eadbb9');fillRect(c,x-12,y-196,24,4,'#b5b1a5');

 for(let i=0;i<3;i++){

function drawObject(c,o){switch(o.type){case 'house':drawHouse(c,o);break;case 'fence':drawFence(c,o);break;case 'car':drawCar(c,o);break;case 'vending':drawVending(c,o);break;case 'lamp':drawLamp(c,o);break;case 'pots':drawPots(c,o);break}}
// One approved 16-direction image supplies every pose; no inconsistent generated full-body swaps.
// Weight shifts across torso/coat/arms while both original shoes alternate ground contact.
const STRIDE_WORLD=108;
const FOOT_SOURCE_Y=120,FOOT_SOURCE_H=24;
const PIVOT_Y=116,TORSO_BOTTOM=127;
function sprite(c){
 if(!ready)return;
 const dw=92,dh=103,scaleX=dw/128,scaleY=dh/144;
 const f=idleMap[player.dir16],sx=f*128;
 const blend=player.gaitBlend;
 const phase=2*Math.PI*player.stepDistance/STRIDE_WORLD;
 const sin=Math.sin(phase),cos=Math.cos(phase);
 const theta=player.dir16*Math.PI/8;
 const forwardX=Math.cos(theta),forwardY=Math.sin(theta);
 const lateralX=-forwardY,lateralY=forwardX;
 const weight=sin*blend;
 const hipShiftX=lateralX*weight*2.05;
 const hipShiftY=lateralY*weight*.45+blend*.45*(1-Math.cos(phase*2));
 const roll=blend*(.009*sin+.002*Math.sin(2*phase));
 const span=blend*4.0,lift=blend*1.65;
 const footA={x:forwardX*sin*span+lateralX*.25*weight,
              y:forwardY*sin*span-Math.max(0,cos)*lift};
 const footB={x:-forwardX*sin*span-lateralX*.25*weight,
              y:-forwardY*sin*span-Math.max(0,-cos)*lift};
 const swingA=Math.max(0,cos)*blend,swingB=Math.max(0,-cos)*blend;
 const localX=player.x-dw/2,localY=player.y-137*scaleY;
 // Artwork shoes end at source y=137, not 140. The footprint shadow meets those soles.
 ellipse(c,player.x,player.y-.1,12.5,2.05,'#050b1188');
 const contacts=[
  {px:53+footA.x,py:137+forwardY*sin*span,air:swingA},
  {px:75+footB.x,py:137-forwardY*sin*span,air:swingB}
 ];
 for(const v of contacts){
  const wx=localX+v.px*scaleX,wy=localY+v.py*scaleY;
  ellipse(c,wx,wy-.15,4.3-v.air*.6,1.30-v.air*.25,
      v.air>.5?'#07101824':'#050a1064');
 }
 c.save();c.translate(localX,localY);c.scale(scaleX,scaleY);
 // Swing feet draw first; the lower coat hem hides their attachment seams.
 for(const leg of [
    {x:38,w:26,d:footA},
    {x:64,w:29,d:footB}
 ]){
  c.save();c.translate(leg.d.x,leg.d.y);
  c.drawImage(idle,sx+leg.x,FOOT_SOURCE_Y,leg.w,FOOT_SOURCE_H,
     leg.x,FOOT_SOURCE_Y,leg.w,FOOT_SOURCE_H);
  c.restore();
 }
 // Do not keep the upper body rigid or introduce head-position jumps between frames.
 c.save();c.translate(64+hipShiftX,PIVOT_Y+hipShiftY);
 c.rotate(roll);c.translate(-64,-PIVOT_Y);
 c.drawImage(idle,sx,0,128,TORSO_BOTTOM,0,0,128,TORSO_BOTTOM);
 c.restore();c.restore();
}
function drawWorld(){
 g.drawImage(bg,0,0);
 const drawables=T.items.map(o=>({y:o.baseY,draw:()=>drawObject(g,o)}));
 const house=T.items.find(o=>o.id==='house');
 // Roof is separately layered at the house footprint's front-facing depth.
 drawables.push({y:house.baseY,draw:()=>drawRoof(g,house)});
 drawables.push({y:player.y,draw:()=>sprite(g)});
 drawables.sort((a,b)=>a.y-b.y);
 for(const d of drawables)d.draw();
 if(DEBUG){
  g.lineWidth=2;g.strokeStyle='#fe717195';
  for(const o of T.items){const r=o.body;g.strokeRect(r.x,r.y,r.w,r.h)}
  g.strokeStyle='#ffe29a';g.beginPath();g.ellipse(player.x,player.y,player.rx,player.ry,0,0,Math.PI*2);g.stroke();
  g.strokeStyle='#a9d7ecaa';for(const s of T.surfaces){const r=s.rect;g.strokeRect(r.x,r.y,r.w,r.h)}
 }
 // Soft nighttime vignette; dim atmosphere but preserve readable collision edges.
 const v=g.createRadialGradient(player.x,player.y,170,player.x,player.y,670);
 v.addColorStop(0,'#00000000');v.addColorStop(1,'#050b15a5');fillRect(g,0,0,T.W,T.H,v);
}
function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 view={w:innerWidth,h:innerHeight,dpr};
 canvas.width=Math.round(view.w*dpr);canvas.height=Math.round(view.h*dpr);
 canvas.style.width=view.w+'px';canvas.style.height=view.h+'px';
 // cover crops the horizontal town on portrait devices rather than stretching pixels.
 camera.zoom=clamp(Math.max(view.w/1080,view.h/900),.88,1.05);
 camera.x=clamp(camera.x,view.w/(2*camera.zoom),T.W-view.w/(2*camera.zoom));
 camera.y=clamp(camera.y,view.h/(2*camera.zoom),T.H-view.h/(2*camera.zoom));
}
resize();addEventListener('resize',resize,{passive:true});
function padUpdate(e){
 const r=pad.getBoundingClientRect();const dx=(e.clientX-(r.left+r.width/2))/62,dy=(e.clientY-(r.top+r.height/2))/62;
 const m=Math.hypot(dx,dy);const x=m>1?dx/m:dx,y=m>1?dy/m:dy;
 stick.x=x;stick.y=y;
 nub.style.transform=`translate(calc(-50% + ${Math.round(x*55)}px),calc(-50% + ${Math.round(y*55)}px))`;
}
pad.addEventListener('pointerdown',e=>{if(touchId!==null)return;touchId=e.pointerId;pad.setPointerCapture(e.pointerId);padUpdate(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===touchId)padUpdate(e)});
function padReset(e){if(e.pointerId!==touchId)return;touchId=null;stick={x:0,y:0};nub.style.transform='translate(-50%,-50%)'}
for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,padReset);
function setKey(e,down){const name=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(name))e.preventDefault();if(down)pressed.add(name);else pressed.delete(name)}
addEventListener('keydown',e=>setKey(e,true));addEventListener('keyup',e=>setKey(e,false));
addEventListener('blur',()=>{pressed.clear();stick={x:0,y:0}});
function direction(){
 let x=stick.x,y=stick.y;
 const kx=+(pressed.has('arrowright')||pressed.has('d'))-+(pressed.has('arrowleft')||pressed.has('a'));
 const ky=+(pressed.has('arrowdown')||pressed.has('s'))-+(pressed.has('arrowup')||pressed.has('w'));
 if(kx||ky){x=kx;y=ky}
 const len=Math.hypot(x,y),amt=len>.14?Math.pow((Math.min(1,len)-.14)/.86,.72):0;
 if(len){x/=len;y/=len}
 return {x,y,amt};
}
function motionTick(dt){
 const v=direction(),wantedSpeed=v.amt>0?72+156*v.amt:0;
 let tvx=v.x*wantedSpeed,tvy=v.y*wantedSpeed;
 const gain=(wantedSpeed>Math.hypot(player.vx,player.vy)?720:1650)*dt;
 // A bounded per-axis velocity adjustment prevents sudden teleporting or long skates.
 const mx=tvx-player.vx,my=tvy-player.vy,dm=Math.hypot(mx,my);
 if(dm>gain&&gain>0){tvx=player.vx+mx/dm*gain;tvy=player.vy+my/dm*gain}
 player.vx=tvx;player.vy=tvy;
 if(v.amt>0){
  const a=(Math.atan2(v.y,v.x)+Math.PI*2)%(Math.PI*2);
  const sector=Math.round(a/(Math.PI/8))%16;
  // 3 degree hysteresis stabilizes neighbouring sectors under an unsteady thumb.
  let delta=Math.abs(a-rotation8[player.dir16]);delta=Math.min(delta,Math.PI*2-delta);
  if(delta>(Math.PI/16+Math.PI/60))player.dir16=sector;
 }
 // axis sweep prevents passing through corners, and slides naturally along fences.
 const maxPixelStep=4;
 const steps=Math.max(1,Math.ceil(Math.max(Math.abs(player.vx),Math.abs(player.vy))*dt/maxPixelStep));
 let moved=0;
 for(let i=0;i<steps;i++){
  const ox=player.x,oy=player.y;const dx=player.vx*dt/steps,dy=player.vy*dt/steps;
  if(!T.blocked(ox+dx,oy,player.rx,player.ry))player.x+=dx;else player.vx=0;
  if(!T.blocked(player.x,oy+dy,player.rx,player.ry))player.y+=dy;else player.vy=0;
  moved+=Math.hypot(player.x-ox,player.y-oy);
 }
 player.moving=moved>Math.max(.015,dt*7);
 const gaitTarget=player.moving?1:0;
 player.gaitBlend+=(gaitTarget-player.gaitBlend)*(1-Math.exp(-dt*(player.moving?15:12)));
 player.actualDistance=moved;
 if(player.moving)player.stepDistance+=moved;
 return moved;
}
let last=performance.now(),statusAge=0;
function frame(t){
 const dt=Math.min(.04,Math.max(0,(t-last)/1000));last=t;
 motionTick(dt);
 // Responsive camera follows the feet, never scales the world nonuniformly.
 const visW=Math.min(T.W,view.w/camera.zoom),visH=Math.min(T.H,view.h/camera.zoom);
 const minX=visW/2,maxX=T.W-visW/2,minY=visH/2,maxY=T.H-visH/2;
 const targetX=clamp(player.x,minX,maxX),targetY=clamp(player.y,minY,maxY);
 const smooth=1-Math.exp(-dt*7);
 camera.x+=(targetX-camera.x)*smooth;camera.y+=(targetY-camera.y)*smooth;
 g.setTransform(view.dpr,0,0,view.dpr,0,0);fillRect(g,0,0,view.w,view.h,'#0b141e');
 g.save();g.translate(view.w/2,view.h/2);g.scale(camera.zoom,camera.zoom);g.translate(-camera.x,-camera.y);
 drawWorld();g.restore();
 if(t-statusAge>120){
  statusAge=t;
  const sp=Math.round(Math.hypot(player.vx,player.vy));
  hud.textContent=`${player.dir16*22.5}° / ${player.moving?'移動':'停止'} / ${sp}`;
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.KAERIBI_TEST={
  version:'0.6',characterSource:'directional-v01 approved draft',
  get state(){return {x:player.x,y:player.y,dir16:player.dir16,moving:player.moving,gaitBlend:player.gaitBlend,travel:player.stepDistance,actualDistance:player.actualDistance,ready,zoom:camera.zoom}},
  get map(){return T},
  setPlayer(x,y){if(!T.blocked(x,y,player.rx,player.ry)){player.x=x;player.y=y;player.vx=player.vy=0;return true}return false},
  testMove(dx,dy,dt=.016){let xo=player.x,yo=player.y;player.vx=dx;player.vy=dy;motionTick(dt);return {moved:Math.hypot(player.x-xo,player.y-yo),x:player.x,y:player.y}},
  setStick(x,y){stick={x,y}},
  setPose(dir16,stride,blend=1){player.dir16=dir16%16;player.stepDistance=stride;player.gaitBlend=blend;player.moving=blend>.01},
};
})();
