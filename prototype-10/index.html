<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101921;color:#e8f0ed;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}#interface{pointer-events:none;position:fixed;inset:0}#heading{position:absolute;top:max(15px,env(safe-area-inset-top));left:18px;font-size:17px;letter-spacing:.12em;text-shadow:0 2px 12px #000b;font-weight:600}.sub{display:block;font-weight:400;letter-spacing:.07em;font-size:10px;opacity:.8;padding-top:6px}#status{position:absolute;right:14px;top:max(17px,env(safe-area-inset-top));font-variant-numeric:tabular-nums;font-size:11px;line-height:1.6;opacity:.8;text-shadow:0 1px 9px #000}#stick{position:absolute;bottom:max(26px,env(safe-area-inset-bottom) + 8px);left:22px;width:158px;height:158px;border-radius:50%;border:1px solid #f6fbff48;background:#b7c9de1a;box-shadow:inset 0 0 38px #b6c7dd0a,0 5px 32px #02050966;pointer-events:auto;touch-action:none;user-select:none}#stickInner{position:absolute;left:50%;top:50%;width:66px;height:66px;border-radius:50%;background:#edf5ff4d;border:1px solid #fff9;transform:translate(-50%,-50%);box-shadow:0 2px 10px #0005;pointer-events:none}#hint{position:absolute;left:16px;right:16px;bottom:max(199px,env(safe-area-inset-bottom) + 190px);font-size:11px;letter-spacing:.05em;text-align:center;opacity:.75;text-shadow:0 1px 10px #000}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:17px 22px;background:#111c29ed;border:1px solid #879aa84a;border-radius:10px;font-size:12px;text-align:center;opacity:1;transition:opacity .3s ease}#loading.hidden{opacity:0;pointer-events:none}@media(min-width:900px){#stick{opacity:.47}#hint{bottom:20px}}@media(max-height:560px){#hint{display:none}}

<script>/* KAERIBI geometry revision 03.
   All blocking objects have a visible silhouette. No navmesh-painted hidden walls.
   Road, driveways, property boundary, and every collider have one shared source.
*/
(() => {
'use strict';
const W=1280,H=960;
const R=(x,y,w,h)=>({x,y,w,h});
const items=[
 {id:'house',type:'house',body:R(574,332,340,164),roof:[[531,358],[585,232],[902,232],[950,355],[914,383],[557,383]],baseY:496},
 {id:'fenceBack',type:'fence',body:R(520,190,455,14),baseY:204},
 {id:'fenceWest',type:'fence',body:R(520,190,16,392),baseY:582},
 {id:'fenceEast',type:'fence',body:R(960,190,16,392),baseY:582},
 {id:'fenceFrontLeft',type:'fence',body:R(520,571,202,19),baseY:590},
 {id:'fenceFrontRight',type:'fence',body:R(822,571,154,19),baseY:590},
 {id:'car',type:'car',body:R(66,328,99,175),baseY:503},
 {id:'vending',type:'vending',body:R(1104,552,72,47),baseY:599},
 {id:'lamp',type:'lamp',body:R(438,564,14,14),baseY:578},
 {id:'potsA',type:'pots',body:R(545,533,64,25),baseY:558},
 {id:'potsB',type:'pots',body:R(895,533,64,25),baseY:558},
];
const surfaces=[
 {id:'streetEastWest',type:'road',rect:R(0,603,W,214)},
 {id:'streetNorthSouth',type:'road',rect:R(214,0,210,H)},
 {id:'parking',type:'parking',rect:R(18,240,174,364)},
 {id:'driveway',type:'paving',rect:R(720,496,104,107)},
 {id:'courtyard',type:'property',rect:R(522,204,450,369)},
 {id:'vendingPad',type:'paving',rect:R(1074,588,126,42)},
];
function intersects(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y}
function overFoot(x,y,rx=10,ry=6,rect){
 const nx=Math.min(rect.x+rect.w,Math.max(rect.x,x)),ny=Math.min(rect.y+rect.h,Math.max(rect.y,y));
 return ((x-nx)/rx)**2 + ((y-ny)/ry)**2 < 1;
}
function blocked(x,y,rx=10,ry=6){
 return x-rx<8||y-ry<8||x+rx>W-8||y+ry>H-8||items.some(o=>overFoot(x,y,rx,ry,o.body));
}
const town={W,H,items,surfaces,blocked,overFoot,intersects,start:{x:745,y:708},gate:{left:722,right:822,y:581},entrance:{x:772,y:503}};
Object.freeze(town.items);Object.freeze(town.surfaces);window.KAERIBI_TOWN=town;
})();
</script>

class HeroAnimator{

  const x=player.x-drawW*(clip.originX/fw);

  const n=clip.frames;
